    metadata:
      coordinate_class: synthetic
      role: destination_demo
      sensitivity: non_sensitive_public_zone_centroid
rail:
  access:
    id: S
    name: Olympic Park Station Public Access Point
    lat: 37.5166
    lon: 127.1302
    metadata:
      coordinate_class: public
      role: rail_access_demo
      sensitivity: public_station_area
  egress:
    id: R
    name: Jamsil Station Public Egress Point
    lat: 37.5133
    lon: 127.1002
    metadata:
      coordinate_class: public
      role: rail_egress_demo
      sensitivity: public_station_area
  travel_time_min: 13
  headway_min: 8
  capacity_pax_per_train: 1000
  metadata:
    source_class: literature-derived
    operational_claim: scheduled_service_proxy_not_emergency_availability
    source_notes: >
      Derived from Seoul Metro Lines 2/8/9 service data. Travel time:
      Line 9 Olympic Park -> Sports Complex (6 stops, ~6.2 km) + transfer
      (~3-5 min) + Line 2 Sports Complex -> Jamsil (2 stops, ~2.4 km).
      Headway: blended peak/off-peak across Lines 2/8/9.
      Capacity: Line 9 6-car train crush capacity ~960-1200 pax.
      Sources: Wikipedia Seoul Subway Line 2/8/9 articles, Namuwiki
      Line 9 article, Seoul Metro official service data.
      GTFS available at data.go.kr dataset 15042735.
